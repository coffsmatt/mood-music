<style>
:root{--bg:#FBF5EC;--card:#FFFFFF;--ink:#2A1E1A;--soft:#7A6A60;--line:#EADFCF;--chip:#F2E7D7;--acc:#E8572A;--acc-ink:#FFFFFF;--teal:#1F8A8A;--gold:#D9981E;--au:#0F7A4A;--au-bg:#E3F3EA;--bar:#E9DCCB;--shadow:0 2px 12px rgba(70,35,10,.07);

@media (prefers-color-scheme:dark){:root{--bg:#17120F;--card:#221B17;--ink:#F3E9DC;--soft:#B3A394;--line:#382D26;--chip:#2E2520;--acc:#FF7A4D;--acc-ink:#1A0F0A;--teal:#4FC3C3;--gold:#F2C14E;--au:#5CD39A;--au-bg:#17342A;--bar:#3A2F28;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc)}
.top{padding:14px 16px 6px;display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
.top h1 span{display:block;font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.02em}
.stripe{height:4px;margin:0 16px 4px;border-radius:4px;background:linear-gradient(90deg,var(--d60) 0 25%,var(--d70) 25% 50%,var(--d80) 50% 75%,var(--d90) 75%)}
main{max-width:560px;margin:0 auto}
.tab{display:none;padding:8px 16px 16px}.tab.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:18px 0 8px;font-weight:700}
h3{margin:0;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;border:2px solid transparent}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.au.on{background:var(--au);color:#fff}
.row{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px;margin:8px 0}
.row>label,.row>span{font-weight:700;font-size:14px}
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--chip);border-radius:14px;padding:4px;gap:2px}
.seg button{min-height:42px;border-radius:10px;font-weight:600;font-size:14px;padding:0 4px}
.seg button.on{background:var(--acc);color:var(--acc-ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg.sm button{min-height:36px;font-size:13px}
details.geek{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.geek summary{list-style:none;min-height:50px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
details.geek summary::-webkit-details-marker{display:none}
details.geek summary .badge{font-size:12px;font-weight:600;background:var(--acc);color:var(--acc-ink);padding:3px 8px;border-radius:999px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.geek summary .chev{margin-left:auto;transition:transform .2s}
details.geek[open] summary .chev{transform:rotate(90deg)}
.geekbody{padding:2px 0 14px}
select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 12px}
.btns{display:flex;gap:10px;margin:16px 0 4px}
.btn{flex:1;min-height:50px;border-radius:14px;font-weight:700;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sm{min-height:40px;flex:0 0 auto;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.phw{display:flex;align-items:center}
.phw .ph{flex:1;min-width:0;padding-right:6px}
a.play,ol.pl a.play{flex:none;width:46px;height:46px;margin-right:12px;border-radius:50%;background:#1DB954;color:#062b14;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;padding:0 0 0 3px;font-weight:700}
ol.pl a.play{margin-right:0;width:42px;height:42px}
a.play:active{transform:scale(.92)}
.ph{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px;min-height:64px}
.ph .pt{flex:1;min-width:0}
.ph .pt b{display:block;font-size:16px;line-height:1.25}
.ph .pt small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.plabel{display:block;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pct{font-weight:800;font-size:20px;color:var(--teal);font-variant-numeric:tabular-nums}
.pct small{font-size:12px}
.chev{color:var(--soft);font-size:22px;transition:transform .2s}
.card.open .ph .chev{transform:rotate(90deg)}
.cb{padding:0 14px 14px}
.desc{margin:0 0 10px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.why span{font-size:12.5px;font-weight:600;background:var(--chip);padding:5px 10px;border-radius:999px}
.why span.au{background:var(--au-bg);color:var(--au)}
.meta{font-size:13px;color:var(--soft);margin:0 0 10px}
.bars{display:grid;gap:7px;margin:4px 0 12px}
.bar{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
.track{position:relative;height:8px;background:var(--bar);border-radius:6px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--teal)}
.tick{position:absolute;top:-4px;width:3px;height:16px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin:-2px 0 0 80px}
.tags{font-size:13px;color:var(--soft);margin:0 0 12px}
.links{display:flex;gap:8px;margin:0 0 10px}
.links a{flex:1;min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;text-decoration:none;font-size:14px}
.sp{background:#1DB954;color:#062b14}
.am{background:#FA2D48;color:#fff}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{min-height:42px;border-radius:12px;background:var(--chip);font-size:13px;font-weight:600}
.rate button.on{background:var(--ink);color:var(--bg)}
.flag{font-size:13px}
.people{font-size:12.5px;color:var(--soft);padding:0 14px 12px;margin-top:-6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.people b{color:var(--ink)}
.note{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.note b{display:block;margin-bottom:2px}
.empty{color:var(--soft);text-align:center;padding:24px 8px}
.person{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.person .pn{display:flex;gap:8px;margin-bottom:6px}
.person input{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 12px;font-weight:700;font-size:16px}
.person .x{width:44px;min-height:44px;border-radius:12px;background:var(--chip);font-size:18px}
.person .row{grid-template-columns:62px 1fr;margin:6px 0}
.person .chips{gap:6px}.person .chip{min-height:36px;padding:0 11px;font-size:13px}
ol.pl{padding:0;margin:0;list-style:none;counter-reset:pl}
ol.pl li{counter-increment:pl;display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.pl li:last-child{border:0}
ol.pl li::before{content:counter(pl);font-weight:800;color:var(--acc);width:22px;text-align:right;font-variant-numeric:tabular-nums}
ol.pl .t{flex:1;min-width:0}ol.pl .t b{display:block;font-size:15px}ol.pl .t small{color:var(--soft)}
ol.pl a{font-size:13px;font-weight:700;text-decoration:none;padding:8px;border-radius:10px;background:var(--chip);color:var(--ink)}
.crate h3{font-size:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.taste{font-size:20px;font-weight:800;margin:4px 0 10px;line-height:1.25}
.search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.count{font-size:13px;color:var(--soft);margin:10px 0 0}
.game .clue{font-size:17px;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opts button{min-height:58px;border-radius:14px;background:var(--chip);font-size:20px;font-weight:800}
.opts button.right{background:var(--au);color:#fff}
.opts button.wrong{background:#C0392B;color:#fff}
.score{display:flex;gap:8px}.score div{flex:1;background:var(--chip);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--soft)}
.score b{display:block;font-size:20px;color:var(--ink)}
.reveal{font-size:15px;margin:4px 0 10px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--chip);border-radius:14px;padding:10px 12px;margin:10px 0}
.confirm span{flex:1 1 100%;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:11.5px;font-weight:600;color:var(--soft);border-radius:12px}
.tabbar button i{font-style:normal;font-size:22px;line-height:1}
.tabbar button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sub{font-size:14px;color:var(--soft);margin:2px 0 8px}
.hidden{display:none!important}
</style>
</head>

function targetsFor(e,m,s,o,geek){

 {id:'cheater',e:'💔',n:'Cheater Songs',b:'80s sneakers (and a few 70s repeat offenders). Lipstick on the collar not included.',s:['George Michael|Careless Whisper','Rupert Holmes|Escape (The Piña Colada Song)','Squeeze|Tempted','Atlantic Starr|Secret Lovers','Dolly Parton|Jolene','Eagles|Lyin\' Eyes','Billy Paul|Me and Mrs. Jones','Mary MacGregor|Torn Between Two Lovers','Marvin Gaye|I Heard It Through the Grapevine','Fleetwood Mac|Little Lies','Michael Jackson|Billie Jean','Sade|Smooth Operator']},

 {id:'uglycry',e:'😭',n:'Ugly-Cry Ballads',b:'Tissues ready. Mascara optional. Lean into it.',s:['Bonnie Tyler|Total Eclipse of the Heart','Sinéad O\'Connor|Nothing Compares 2 U','Nilsson|Without You','ABBA|The Winner Takes It All','Air Supply|All Out of Love','Roxette|It Must Have Been Love','Heart|Alone','George Jones|He Stopped Loving Her Today','Moving Pictures|What About Me','Crowded House|Don\'t Dream It\'s Over','Patsy Cline|Crazy','Cold Chisel|Flame Trees']},

 {id:'dad',e:'🕺',n:'Dad-Dancing at the Wedding',b:'Guaranteed to get Uncle Kev on the dancefloor, tie round his head.',s:['Ike & Tina Turner|Nutbush City Limits','Daddy Cool|Eagle Rock','John Paul Young|Love Is in the Air','Dexys Midnight Runners|Come On Eileen','Kenny Loggins|Footloose','Village People|Y.M.C.A.','Kool & the Gang|Celebration','Earth, Wind & Fire|September','ABBA|Dancing Queen','Boney M.|Rasputin','Hall & Oates|You Make My Dreams','Kylie Minogue|Locomotion']}
].map(c=>Object.assign(c,{items:c.s.map(s=>{const [a,t]=s.split('|');return BYID[slug(a+'-'+t)]}).filter(Boolean)}));
let CRATE='';
function renderCrates(){
  const c=CRATES.find(c=>c.id===CRATE);
  let h=`<h2>😂 Cheeky crates</h2><div class="chips">${CRATES.map(k=>`<button class="chip${k.id===CRATE?' on':''}" data-act="crate" data-v="${k.id}" aria-pressed="${k.id===CRATE}">${k.e} ${k.n}</button>`).join('')}</div>`;
  if(c)h+=`<div class="box crate" id="crate-box"><h3>${c.e} ${c.n}</h3><p class="sub">${esc(c.b)}</p><ol class="pl">${c.items.map(x=>`<li><span class="t"><b>${esc(x.title)}</b><small>${esc(x.artist)} · ${x.year}${x.country==='AU'?' · 🇦🇺':''}</small></span>${playBtn(x)}</li>`).join('')}</ol>
   <div class="btns"><button class="btn pri" data-act="share-crate">📤 Share this crate</button></div></div>`;
  $('#mix-crates').innerHTML=h;
}
const gemList=list=>list.filter(i=>i.x.tier===2).slice(0,8);
function renderMix(){renderMixCtl();renderMixRes();renderCrates()}
function mixChanged(){SURP=-1;saveMix();renderMix()}

// ---------- ROOM ----------
function personScore(x,p){const T=targetsFor(p.e,p.m,p.s,'',null);return pct(raw(x,T)+(p.d&&x.decade===p.d?.04:0))}
function groupRank(ppl,pool){return pool.map(x=>{const ps=ppl.map(p=>personScore(x,p)),avg=ps.reduce((a,b)=>a+b,0)/ps.length,mn=Math.min(...ps);return{x,ps,p:Math.round(.6*avg+.4*mn)}}).sort((a,b)=>b.p-a.p)}
function distinct(list,n){const u=new Set(),o=[];for(const i of list){if(u.has(i.x.artist))continue;u.add(i.x.artist);o.push(i);if(o.length>=n)break}return o}
function renderRoomCtl(){
  $('#room-ctl').innerHTML=`<h2>Who's in the room?</h2><p class="sub">Everyone picks a vibe in a few taps. We find what keeps the most people happy.</p>`+
  ROOM.map((p,i)=>`<div class="person"><div class="pn"><input value="${esc(p.n)}" data-in="name" data-i="${i}" maxlength="20" aria-label="Name"><button class="x" data-act="room-del" data-i="${i}" aria-label="Remove ${esc(p.n)}"${ROOM.length<=2?' disabled style="opacity:.35"':''}>✕</button></div>
   <div class="row"><span>Energy</span>${seg('room','e',p.e,EL,'sm').replace(/data-k="e"/g,`data-k="e" data-i="${i}"`)}</div>
   <div class="row"><span>Mood</span>${seg('room','m',p.m,['Moody','Between','Upbeat'],'sm').replace(/data-k="m"/g,`data-k="m" data-i="${i}"`)}</div>
   <div class="row"><span>Sound</span>${seg('room','s',p.s,SL,'sm').replace(/data-k="s"/g,`data-k="s" data-i="${i}"`)}</div>
   <div class="row"><span>Decade</span><div class="chips">${[0,...DECS].map(d=>`<button class="chip${p.d===d?' on':''}" data-act="room-dec" data-i="${i}" data-v="${d}">${d?d+'s':'Any'}</button>`).join('')}</div></div></div>`).join('')+
  (ROOM.length<8?`<button class="btn" data-act="room-add" style="width:100%">➕ Add person</button>`:'');
}
function renderRoomRes(){
  const ppl=ROOM,pool=CAT.filter(x=>R[x.id]!=='nope');
  const ranked=groupRank(ppl,pool),top=distinct(ranked,5);
  let h='<h2>Best for the room</h2>';
  top.forEach((it,i)=>{const sub=`<div class="people">${ppl.map((p,j)=>`<span>${esc(p.n)} <b>${it.ps[j]}%</b></span>`).join('')}</div>`;
    h+=card(it,{key:'room-'+i,label:'#'+(i+1)+' for everyone',sub})});
  if(top[0]){const ps=top[0].ps,mi=ps.indexOf(Math.min(...ps)),spread=Math.max(...ps)-ps[mi];
    h+=`<div class="note"><b>🤝 Who's compromising?</b>${spread<8?'Nobody really — you lot are on the same page.':`${esc(ppl[mi].n)} is giving the most ground on #1 (${ps[mi]}%). Maybe they choose the next one.`}</div>`;}
  // two-pick plan
  let far=0,a=0,b=1;
  for(let i=0;i<ppl.length;i++)for(let j=i+1;j<ppl.length;j++){const d=Math.abs(ppl[i].e-ppl[j].e)+Math.abs(ppl[i].m-ppl[j].m)+Math.abs(ppl[i].s-ppl[j].s);if(d>far){far=d;a=i;b=j}}
  if(far>=3){
    const tdist=(p,q)=>Math.abs(p.e-q.e)+Math.abs(p.m-q.m)+Math.abs(p.s-q.s);
    const A=[],B=[];ppl.forEach(p=>(tdist(p,ppl[a])<=tdist(p,ppl[b])?A:B).push(p));
    const pa=groupRank(A,pool)[0],used=pa?pa.x.artist:'';
    const pb=groupRank(B,pool).find(i=>i.x.artist!==used);
    if(pa&&pb)h+=`<div class="note"><b>✌️ Two-pick plan</b>Tastes are pretty far apart, so take turns:<br>① <b style="display:inline">${esc(pa.x.title)}</b> — ${esc(pa.x.artist)} for ${A.map(p=>esc(p.n)).join(', ')}<br>② <b style="display:inline">${esc(pb.x.title)}</b> — ${esc(pb.x.artist)} for ${B.map(p=>esc(p.n)).join(', ')}</div>`;
  }
  const pl=distinct(ranked.filter(i=>i.x.type==='song'),10);
  h+=`<h2>Shared playlist · top 10 songs</h2><div class="box"><ol class="pl">${pl.map(i=>`<li><span class="t"><b>${esc(i.x.title)}</b><small>${esc(i.x.artist)} · ${i.x.year} · ${i.p}%</small></span>${playBtn(i.x)}</li>`).join('')}</ol></div>
  <div class="btns"><button class="btn pri" data-act="share-room">📤 Share room picks</button></div>`;
  $('#room-res').innerHTML=h;
  renderRoomRes.pl=pl;renderRoomRes.top=top;
}
function renderRoom(){renderRoomCtl();renderRoomRes()}
function saveRoom(){LS.set('room',ROOM);if(TAB==='room')try{history.replaceState(null,'',roomHash())}catch(e){}}

// ---------- MY MUSIC ----------
function renderMine(){
  const ts=tasteSummary(),groups=[['love','👍 Loved it'],['want','🔖 Want to hear'],['nope','👎 Not for me']];
  const ids=Object.keys(R).filter(id=>BYID[id]);
  let h='<h2>Your taste</h2>';
  if(ts)h+=`<div class="box"><div class="taste">${esc(ts.text)}</div><p class="sub">Based on ${ts.n} loves. Your loves and passes quietly steer every pick.</p><button class="btn pri" data-act="taste-apply" style="width:100%">🎛️ Set the sliders to my taste</button></div>`;
  else h+=`<div class="note"><b>Tap 👍 on a couple of favourites</b>After two loves you'll get a taste summary here, and picks start leaning your way.</div>`;
  if(!ids.length)h+=`<div class="empty">Nothing rated yet. Open any pick and tap 👍, 👎 or 🔖.</div>`;
  groups.forEach(([v,l])=>{const list=ids.filter(id=>R[id]===v).map(id=>BYID[id]).sort((a,b)=>a.year-b.year);
    if(list.length)h+=`<h2>${l} (${list.length})</h2>`+list.map(x=>card(x,{key:'mine-'+x.id})).join('')});
  if(ids.length){h+=`<div class="btns"><button class="btn pri" data-act="share-mine">📤 Share my list</button><button class="btn" data-act="mine-clear">🗑️ Clear list</button></div>`;
    if(CLEARASK)h+=`<div class="confirm" role="alertdialog"><span>Clear all ${ids.length} ratings on this phone? This can't be undone.</span><button class="btn sm pri" data-act="mine-clear-yes">Yes, clear</button><button class="btn sm" data-act="mine-clear-no">Cancel</button></div>`;}
  $('#tab-mine').innerHTML=h;
}

// ---------- EXPLORE ----------
function renderExCtl(){
  let h=`<div style="margin-top:6px">${seg('exmode','mode',EX.mode==='browse'?0:1,['🔍 Browse','🎯 Guess the year'])}</div>`;
  if(EX.mode==='browse')h+=`<div style="margin-top:12px"><input class="search" type="search" placeholder="Search title, artist, genre…" value="${esc(EX.q)}" data-in="search" aria-label="Search"></div>
   <div class="chips" style="margin-top:10px">${[0,...DECS].map(d=>`<button class="chip${EX.d===d?' on':''}" data-act="ex-dec" data-v="${d}">${d?d+'s':'Any'}</button>`).join('')}<button class="chip au${EX.au?' on':''}" data-act="ex-au">🇦🇺</button></div>`;
  $('#ex-ctl').innerHTML=h;
}
function exList(){const qq=EX.q.trim().toLowerCase();
  return CAT.filter(x=>(!EX.d||x.decade===EX.d)&&(EX.t==='b'||(EX.t==='a')===(x.type==='album'))&&(!EX.au||x.country==='AU')&&
   (!qq||(x.title+' '+x.artist+' '+GENRES[x.genre]+' '+x.year+' '+x.tags.join(' ')).toLowerCase().includes(qq))).sort((a,b)=>a.year-b.year||a.title.localeCompare(b.title))}
function renderExRes(){
  if(EX.mode==='game'){renderGame();return}
  const l=exList();
  let h=`<p class="count">${l.length} of ${CAT.length} · tap one to see more</p>`+l.slice(0,EX.n).map(x=>card(x,{key:'ex-'+x.id})).join('');
  if(l.length>EX.n)h+=`<button class="btn" data-act="ex-more" style="width:100%">Show more</button>`;
  if(!l.length)h+=`<div class="empty">Nothing found. Try another word.</div>`;
  $('#ex-res').innerHTML=h;
}
function renderExplore(){renderExCtl();renderExRes()}

// ---------- GAME ----------
function newRound(){
  const x=CAT[Math.floor(Math.random()*CAT.length)],ys=new Set([x.year]);
  let guard=0;while(ys.size<4&&guard++<200){const y=x.year+Math.round((Math.random()*2-1)*9);if(y>=1960&&y<=1999&&y!==x.year)ys.add(y)}
  G.cur=x;G.opts=[...ys].sort((a,b)=>a-b);G.ans=null;
}
function renderGame(){
  if(!G.cur)newRound();
  const x=G.cur;
  let h=`<div class="box game"><div class="score"><div><b>${G.score}/${G.played}</b>Score</div><div><b>${G.streak}</b>Streak</div><div><b>${GAME.best}</b>Best streak</div></div>
  <h2>Pass the phone · what year?</h2>
  <p class="meta">${GENRES[x.genre]} · ${FLAG[x.country]||''}</p>
  <p class="clue">“${esc(x.desc)}”</p>
  <div class="bars">${DIMS.map(([k,l])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${x[k]}%"></div></div></div>`).join('')}</div>
  <p class="tags">Sounds like: ${x.tags.map(esc).join(', ')}</p>
  <div class="opts">${G.opts.map(y=>{let c='';if(G.ans!=null){if(y===x.year)c='right';else if(y===G.ans)c='wrong'}return`<button data-act="g-ans" data-v="${y}" class="${c}"${G.ans!=null?' disabled':''}>${y}</button>`}).join('')}</div>`;
  if(G.ans!=null)h+=`<p class="reveal">${G.ans===x.year?'✅ Nailed it!':'❌ It was '+x.year+'.'} <b>${esc(x.title)}</b> — ${esc(x.artist)}</p><button class="btn pri" data-act="g-next" style="width:100%">Next round →</button>`;
  $('#ex-res').innerHTML=h+'</div>';
}

// ---------- tabs ----------
function showTab(t){TAB=t;
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));
  document.querySelectorAll('.tabbar button').forEach(b=>{const on=b.dataset.v===t;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  try{history.replaceState(null,'',t==='mix'?mixHash():t==='room'?roomHash():location.pathname+location.search)}catch(e){}
  ({mix:renderMix,room:renderRoom,mine:renderMine,explore:renderExplore})[t]();
  window.scrollTo(0,0);
}
function rerenderCurrent(){({mix:renderMixRes,room:renderRoomRes,mine:renderMine,explore:renderExRes})[TAB]()}

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,i=+b.dataset.i;let k=b.dataset.k;
  switch(a){
    case 'tab':showTab(v);break;
    case 'occ':S.o=S.o===v?'':v;mixChanged();break;
    case 'mix':S[k]=+v;mixChanged();break;
    case 'fmt':S.t=['a','s','b'][+v];mixChanged();break;
    case 'dec':if(v==='Any')S.d=[];else{const d=+v;S.d=S.d.includes(d)?S.d.filter(x=>x!==d):[...S.d,d].sort();if(S.d.length===4)S.d=[]}mixChanged();break;
    case 'au':S.au=!S.au;mixChanged();break;
    case 'geekx':S[k]=v===''?null:+v;mixChanged();break;
    case 'geekopen':e.preventDefault();GEEKOPEN=!GEEKOPEN;renderMixCtl();break;
    case 'geekreset':Object.assign(S,{g:'',au:false,xd:null,xi:null,xv:null});if(!mixFiltered().length)Object.assign(S,{d:[],t:'b'});mixChanged();break;
    case 'surprise':{const {list}=mixRanked(),g=gemList(list);if(!g.length){toast('No hidden gems with these filters');break}SURP=SURP<0?0:SURP+1;OPEN.add('surp');renderMixRes();
      const el=document.querySelector('[data-key="surp"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});break}
    case 'toggle':k=b.dataset.key;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);{const art=b.closest('.card');const tmp=document.createElement('div');
      const lab=art.querySelector('.plabel');const sub=art.querySelector('.people');
      const it=resolveCard(k);if(!it){rerenderCurrent();break}
      tmp.innerHTML=card(it.item,{key:k,label:lab?lab.textContent:'',T:it.T,ctx:it.ctx,sub:sub?sub.outerHTML:''});art.replaceWith(tmp.firstElementChild)}break;
    case 'rate':{const id=b.dataset.id;R[id]===v?delete R[id]:R[id]=v;LS.set('ratings',R);
      const art=b.closest('.card');art.querySelectorAll('.rate button').forEach(x=>{const on=R[id]===x.dataset.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
      toast(R[id]==='love'?'👍 Loved — picks will lean this way':R[id]==='nope'?'👎 Noted — you won\'t see it in picks':R[id]==='want'?'🔖 Saved to Want to hear':'Rating removed');
      if(TAB==='mine')renderMine();break}
    case 'share-mix':{const {list}=mixRanked(),P=threePicks(list),L=['🛡️','🔄','🧭'];
      const head=[S.o?OCC.find(o=>o[0]===S.o)[2]:null,EL[S.e],ML[S.m],SL[S.s],S.d.length?S.d.map(d=>d+'s').join('/'):null].filter(Boolean).join(' · ');
      const text=`🎛️ Decades Mood Mixer — ${head}\n`+P.filter(Boolean).map((it,j)=>`${L[j]} ${it.x.title} — ${it.x.artist} (${it.x.year}) ${it.p}%`).join('\n');
      share('Decades Mood Mixer',text,base()+mixHash());break}
    case 'room':ROOM[i][k]=+v;saveRoom();renderRoom();break;
    case 'room-dec':ROOM[i].d=+v;saveRoom();renderRoom();break;
    case 'room-add':if(ROOM.length<8){ROOM.push({n:'Friend '+(ROOM.length+1),e:1,m:1,s:1,d:0});saveRoom();renderRoom()}break;
    case 'room-del':if(ROOM.length>2){ROOM.splice(i,1);saveRoom();renderRoom()}break;
    case 'share-room':{const top=renderRoomRes.top||[],pl=renderRoomRes.pl||[];
      const text=`👥 Decades Mood Mixer — for ${ROOM.map(p=>p.n).join(', ')}\nTop pick: ${top[0]?top[0].x.title+' — '+top[0].x.artist+' ('+top[0].p+'%)':''}\n\nPlaylist:\n`+pl.map((s,j)=>`${j+1}. ${s.x.title} — ${s.x.artist}`).join('\n');
      share('Decades Mood Mixer',text,base()+roomHash());break}
    case 'taste-apply':{const ts=tasteSummary();if(ts){Object.assign(S,{e:ts.e,m:ts.m,s:ts.s,d:[ts.d]});saveMix(false);showTab('mix');toast('Sliders set to your taste')}break}
    case 'share-mine':{const g=[['love','👍 Loved'],['want','🔖 Want to hear'],['nope','👎 Not for me']];const ts=tasteSummary();
      const text='🎛️ My Decades Mood Mixer list'+(ts?'\n'+ts.text:'')+'\n'+g.map(([v,l])=>{const xs=Object.keys(R).filter(id=>R[id]===v&&BYID[id]).map(id=>BYID[id]);return xs.length?`\n${l}\n`+xs.map(x=>`• ${x.title} — ${x.artist} (${x.year})`).join('\n'):''}).join('');
      share('My music list',text,base());break}
    case 'mine-clear':CLEARASK=true;renderMine();break;
    case 'mine-clear-no':CLEARASK=false;renderMine();break;
    case 'mine-clear-yes':R={};LS.set('ratings',R);CLEARASK=false;renderMine();toast('List cleared');break;
    case 'exmode':EX.mode=+v?'game':'browse';renderExplore();break;
    case 'ex-dec':EX.d=+v;EX.n=40;renderExplore();break;
    case 'ex-au':EX.au=!EX.au;EX.n=40;renderExplore();break;
    case 'ex':EX.t=['a','s','b'][+v];EX.n=40;renderExplore();break;
    case 'ex-more':EX.n+=40;renderExRes();break;
    case 'g-ans':{if(G.ans!=null)break;G.ans=+v;G.played++;if(G.ans===G.cur.year){G.score++;G.streak++;if(G.streak>GAME.best){GAME.best=G.streak;LS.set('game',GAME)}}else G.streak=0;renderGame();break}
    case 'g-next':newRound();renderGame();break;
    case 'crate':CRATE=CRATE===v?'':v;renderCrates();if(CRATE){try{history.replaceState(null,'','#crate-'+CRATE)}catch(_){}const el=$('#crate-box');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else saveMix();break;
    case 'share-crate':{const c=CRATES.find(c=>c.id===CRATE);if(c)share('Decades Mood Mixer',`${c.e} ${c.n} — ${c.b}\n\n`+c.items.map((x,j)=>`${j+1}. ${x.title} — ${x.artist} (${x.year})`).join('\n'),base()+'#crate-'+c.id);break}
    case 'play':e.preventDefault();if(BYID[b.dataset.id])playOnSpotify(BYID[b.dataset.id]);break;
  }
});
function resolveCard(k){
  if(k==='surp'||k.startsWith('pick-')){const {T,list}=mixRanked(),ctx={o:S.o,e:S.e,m:S.m,s:S.s,d:S.d};
    if(k==='surp'){const g=gemList(list);return g.length?{item:g[SURP%g.length],T,ctx}:null}
    const it=threePicks(list)[+k.slice(5)];return it?{item:it,T,ctx}:null}
  if(k.startsWith('room-')){const t=(renderRoomRes.top||[])[+k.slice(5)];return t?{item:t}:null}
  const id=k.replace(/^(ex|mine)-/,'');return BYID[id]?{item:BYID[id]}:null;
}
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.in==='search'){EX.q=el.value;EX.n=40;renderExRes()}
  if(el.dataset.in==='name'){ROOM[+el.dataset.i].n=el.value.slice(0,20)||'Friend';saveRoom();clearTimeout(renderRoomRes.t);renderRoomRes.t=setTimeout(renderRoomRes,250)}
});
document.addEventListener('change',e=>{if(e.target.dataset.in==='genre'){S.g=e.target.value;mixChanged()}});
window.addEventListener('hashchange',()=>{if(readHash())showTab(TAB)});

// ---------- boot ----------
readHash();
showTab(TAB);
if(CRATE){try{history.replaceState(null,'','#crate-'+CRATE)}catch(_){}setTimeout(()=>{const el=$('#crate-box');if(el)el.scrollIntoView({block:'start'})},50)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.DMM={CAT,mixRanked,threePicks,CRATES};
})();

</script>
